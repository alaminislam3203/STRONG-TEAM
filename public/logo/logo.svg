<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="320" height="76" fill="none">
  <!-- STRONG -->
  <text x="4" y="44" font-family="'Montserrat', sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#182B44">STR</text>
  
  <!-- Golden Lion Crest in place of O -->
  <g transform="translate(96, 3)">
    <!-- Outer golden mane circle -->
    <circle cx="24" cy="24" r="22" fill="#C5A054"/>
    <!-- Mane stylized curves -->
    <path d="M24 2 C15 2, 7 8, 4 17 C8 12, 16 9, 24 9 C32 9, 40 12, 44 17 C41 8, 33 2, 24 2 Z" fill="#B0893E"/>
    <path d="M5 26 C5 36, 13 44, 24 46 C17 41, 13 34, 13 26 Z" fill="#B0893E"/>
    <path d="M43 26 C43 36, 35 44, 24 46 C31 41, 35 34, 35 26 Z" fill="#B0893E"/>
    <!-- Inner white lion face shield -->
    <path d="M14 14 C14 11, 34 11, 34 14 L33 29 C33 36, 24 41, 24 41 C24 41, 15 36, 15 29 Z" fill="#FFFFFF"/>
    <!-- Lion eyes -->
    <polygon points="17,19 22,21 18,22" fill="#182B44"/>
    <polygon points="31,19 26,21 30,22" fill="#182B44"/>
    <!-- Lion nose & mouth -->
    <polygon points="21,26 27,26 24,30" fill="#182B44"/>
    <path d="M20 33 Q24 31 28 33" stroke="#182B44" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="21,36 27,36 24,41" fill="#182B44"/>
  </g>

  <!-- NG TEAM -->
  <text x="145" y="44" font-family="'Montserrat', sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#182B44">NG TEAM</text>

  <!-- Bottom Gold Lines & STAFFING -->
  <line x1="36" y1="63" x2="96" y2="63" stroke="#C5A054" stroke-width="2.2" stroke-linecap="round"/>
  <text x="160" y="67" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13.5" letter-spacing="6.5" fill="#182B44">STAFFING</text>
  <line x1="220" y1="63" x2="280" y2="63" stroke="#C5A054" stroke-width="2.2" stroke-linecap="round"/>
</svg>
